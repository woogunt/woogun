<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7ea6e0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>우리둘</title>
  <meta property="og:title" content="우리둘 💕" />
  <meta property="og:description" content="둘만의 공간에 초대받았어요. 링크를 눌러 참여해 주세요." />
  <meta property="og:type" content="website" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bg" class="bg"></div>

  <!-- 처음 설정 -->
  <section id="setup" class="setup hidden">
    <div class="setup-card glass">
      <div class="logo">♥</div>
      <h1>우리둘</h1>
      <p class="muted" id="setupLead" data-def="우리만의 공간을 만들어볼까요?">우리만의 공간을 만들어볼까요?</p>
      <div id="authBox" class="stack hidden">
        <div id="kakaoNote" class="kakao-note hidden">
          카카오톡 안에서는 구글 로그인이 안 돼요.<br />휴대폰 기본 브라우저로 열어주세요.
          <button type="button" class="btn" id="openExternal">다른 브라우저로 열기</button>
        </div>
        <button type="button" class="btn google-btn" id="googleBtn"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 2.9-2.2 5.4-4.7 7.1l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.5z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg> Google로 시작하기</button>
        <p class="muted small" style="margin:0">구글로 로그인하면 폰을 바꿔도 기록이 그대로 이어져요.</p>
        <button type="button" class="link" id="anonBtn">로그인 없이 시작하기</button>
      </div>
      <form id="setupForm" class="stack">
        <label>나의 이름<input name="me" required maxlength="12" placeholder="예) 우건" /></label>
        <label>상대 이름<input name="you" required maxlength="12" placeholder="예) 희정" /></label>
        <label>처음 만난 날<input name="start" type="date" required /></label>
        <button class="btn primary" type="submit">새로 시작하기</button>
      </form>
      <div id="joinBox" class="hidden">
        <div class="divider"><span>또는</span></div>
        <form id="joinForm" class="stack">
          <label>상대에게 받은 초대 코드<input name="code" required maxlength="6" placeholder="예) K7MP2Q" autocomplete="off" class="code-input" /></label>
          <button class="btn" type="submit">초대 코드로 연결하기</button>
        </form>
      </div>
      <div id="artifactJoin" class="hidden"></div>
      <p class="muted small" id="setupMsg"></p>
    </div>
  </section>

  <!-- claude.ai 링크에서 공유 공간 확인 중 -->
  <section id="loading" class="setup hidden">
    <div class="setup-card glass">
      <div class="logo">♥</div>
      <p id="loadingMsg" class="muted">우리 공간을 불러오는 중…</p>
    </div>
  </section>

  <!-- 홈 (위젯) -->
  <div id="app" class="app hidden">
    <header class="top">
      <span id="syncBadge" class="sync-badge hidden"></span>
      <div class="top-btns">
        <button class="round-btn" id="addBtn" aria-label="블럭 추가">＋</button>
        <button class="round-btn" id="bellBtn" aria-label="알림">🔔<i id="bellDot" class="dot hidden"></i></button>
        <button class="round-btn" id="gearBtn" aria-label="설정">⚙︎</button>
      </div>
    </header>
    <main id="widgets" class="widgets"></main>
  </div>

  <!-- 전체 화면 페이지 -->
  <section id="page" class="page-sheet hidden" aria-modal="true" role="dialog">
    <header class="page-head">
      <button class="back-btn" id="pageBack" aria-label="뒤로">‹</button>
      <h2 id="pageTitle"></h2>
      <div id="pageAction"></div>
    </header>
    <div id="pageBody" class="page-body"></div>
  </section>

  <!-- 입력 폼 (아래에서 올라오는 시트) -->
  <div id="modal" class="modal hidden">
    <form id="modalForm" class="modal-card">
      <div class="grab"></div>
      <h3 id="modalTitle"></h3>
      <div id="modalFields" class="stack"></div>
      <div class="modal-btns">
        <button type="button" class="btn" id="modalCancel">취소</button>
        <button type="submit" class="btn primary" id="modalOk">저장</button>
      </div>
    </form>
  </div>

  <div id="viewer" class="viewer hidden">
    <img id="viewerImg" alt="" />
    <div id="viewerCap" class="viewer-cap"></div>
    <div class="viewer-actions">
      <button class="btn danger" id="viewerDel">삭제</button>
      <button class="btn" id="viewerClose">닫기</button>
    </div>
  </div>

  <div id="askBox" class="modal ask hidden" role="alertdialog" aria-modal="true">
    <div class="ask-card">
      <p id="askMsg"></p>
      <div class="modal-btns">
        <button type="button" class="btn" id="askCancel">취소</button>
        <button type="button" class="btn primary" id="askOk">확인</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="firebase-config.js"></script>
  <script src="maps/kr.js"></script>
  <script src="maps/sgg-index.js"></script>
  <script src="app.js"></script>
</body>
</html>
