# 코드가 올라오면 우리 앱(https://woogunt-a9c74.web.app)에 자동으로 배포
# 필요한 비밀값: FIREBASE_SERVICE_ACCOUNT_WOOGUNT_A9C74
#   (PC에서 `npx firebase-tools init hosting:github` 를 한 번 실행하면 자동으로 GitHub에 등록돼요)
name: 앱 자동 배포

# 비밀값을 넣기 전까지는 코드를 올릴 때마다 실패하지 않도록 수동 실행만 켜둠.
# 비밀값을 넣은 뒤 자동으로 바꾸려면 아래 push 부분의 주석(#)을 지우면 돼요.
on:
  # push:
  #   branches:
  #     - claude/pensive-mccarthy-5wusj0
  workflow_dispatch: # GitHub 웹에서 "Run workflow" 버튼으로 직접 배포

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 배포 시각 기록
        run: printf '{"deployedAt":"%s","commit":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_SHA::7}" > version.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WOOGUNT_A9C74 }}
          channelId: live
          projectId: woogunt-a9c74
