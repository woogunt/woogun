<title>AI 직원 오피스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* Layout: 팀별 방 카드가 나란히(좁으면 세로로) 놓이고, 각 방 위에 매달린 표지판 */
  :root {
    --bg: #FBF6F1;
    --fg: #3E3550;
    --muted: #8A7F99;
    --card: #FFFFFF;
    --line: #EADFD6;
    --accent: #FF8FA3;
    --sign-wood: #E8B98A;
    --sign-wood-dark: #C98F5E;
    --bar: #F6F0EA;
    --soft: #F7F2F8;
    --up: #E0384B;
    --down: #2F6FD6;
    --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #26222F; --fg: #F3EDF7; --muted: #B3A9C2; --card: #312C3C; --line: #463F55;
      --accent: #FF9DB0; --sign-wood: #D9A878; --sign-wood-dark: #A9774A; --bar: #3A3447; --soft: #3B3548; --up: #FF6B78; --down: #6FA3FF; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #26222F; --fg: #F3EDF7; --muted: #B3A9C2; --card: #312C3C; --line: #463F55;
    --accent: #FF9DB0; --sign-wood: #D9A878; --sign-wood-dark: #A9774A; --bar: #3A3447; --soft: #3B3548; --up: #FF6B78; --down: #6FA3FF; color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
  }
  /* 맥북(약 1440×820 화면) 기준: 위쪽 띠 = 소개·계획(왼쪽) + 시뮬레이션 창(오른쪽), 아래 = 두 방을 한 줄로 */
  .page {
    max-width: 1440px;
    margin: 0 auto;
    padding-block: 10px 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 24px; align-items: start; margin-bottom: 0; }
  .intro { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 18px; }
  .title-row #board-note { flex-basis: 100%; font-size: 12px; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1.2; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
  h1 span { color: var(--accent); }
  .hint { color: var(--muted); margin: 0; font-size: 14px; }

  .intro { gap: 10px; }
  .board { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
  @media (max-width: 1100px) { .board { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .tick { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 5px 8px 4px; min-width: 0; }
  .tick small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tick strong { display: block; font-family: var(--font-display); font-weight: 400; font-size: 15px; line-height: 1.25; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tick em { display: block; font-style: normal; font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  .board-note { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); margin: -2px 0 0; text-align: right; }
  .plan-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px 12px; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; }
  .sig h3 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 400; font-size: 16px; }
  .sig h3 span { font-family: var(--font-body); font-size: 12px; color: var(--muted); margin-left: 6px; }
  .buys { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .buys b { font-weight: 400; font-size: 13px; background: #FFE3E7; color: #9E2337; border-radius: 999px; padding: 1px 10px; }
  .trend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .sig p { margin: 5px 0 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .plan-card .alloc { height: 24px; }
  .plan-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 7px; }
  .plan-head b { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
  .plan-head span { color: var(--muted); font-size: 13px; }
  .alloc { display: flex; height: 26px; border-radius: 13px; overflow: hidden; gap: 3px; }
  .alloc div { display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 12px; white-space: nowrap; overflow: hidden; color: #3E3550; min-width: 0; }
  .alloc-legend { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: 12.5px; color: var(--muted); }
  .alloc-legend li { display: inline-flex; align-items: center; gap: 6px; }
  .alloc-legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }

  /* 시뮬레이션 창 (macOS 창 모양) */
  .simwin { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 40px -18px rgba(62,53,80,.45), 0 2px 6px rgba(62,53,80,.08); overflow: hidden; }
  .simwin.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 4px var(--accent), 0 18px 40px -18px rgba(62,53,80,.45); } 100% { box-shadow: 0 18px 40px -18px rgba(62,53,80,.45), 0 2px 6px rgba(62,53,80,.08); } }
  .titlebar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--bar); border-bottom: 1px solid var(--line); }
  .lights { display: flex; gap: 7px; }
  .lights button { width: 13px; height: 13px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; }
  .lights .red { background: #FF5F57; } .lights .yellow { background: #FEBC2E; } .lights .green { background: #28C840; }
  .lights button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .wtitle { flex: 1; text-align: center; font-family: var(--font-display); font-size: 14px; white-space: nowrap; }
  .live { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .live.on { color: #1E9E5A; }
  .simwin.min .wbody { display: none; }
  .wbody { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .when { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .when b { color: var(--fg); font-weight: 400; }
  .slots { display: flex; gap: 5px; }
  .slots span { width: 62px; text-align: center; font-size: 12px; border-radius: 8px; padding: 2px 0; background: var(--soft); color: var(--muted); font-variant-numeric: tabular-nums; }
  .slots span.done { background: #D9F4E5; color: #1E7A48; }
  .slots span.next { outline: 2px dashed var(--accent); outline-offset: -2px; color: var(--fg); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat { background: var(--soft); border-radius: 10px; padding: 7px 8px 6px; min-width: 0; }
  .stat small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat strong { display: block; font-family: var(--font-display); font-weight: 400; font-size: 20px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat em { display: block; font-style: normal; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stat.good strong { color: #1E9E5A; } .stat.bad strong { color: #D8546E; }
  .subline { margin-top: -4px !important; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); margin: 0; }
  .hist svg { display: block; width: 100%; height: auto; }
  .history[hidden] { display: none; }
  .history { margin: 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--muted); display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
  .wfoot { display: flex; align-items: center; gap: 8px; }
  .wfoot span { flex: 1; }
  .wfoot span { font-size: 11.5px; color: var(--muted); }
  .wfoot span b { color: var(--fg); font-weight: 400; }
  .wfoot button, .reopen { font: inherit; font-size: 13px; color: #FFFFFF; background: #E2667F; border: 0; border-radius: 999px; padding: 5px 14px; cursor: pointer; white-space: nowrap; }
  .wfoot button:disabled { opacity: .6; cursor: progress; }
  .wfoot button:focus-visible, .reopen:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .reopen { justify-self: end; }

  .floor-plan { display: flex; flex-wrap: wrap; gap: 20px 24px; align-items: flex-start; }
  @media (min-width: 1100px) { .floor-plan { flex-wrap: nowrap; } }
  @media (max-width: 900px) { .top { grid-template-columns: minmax(0, 1fr); } .plan-card { grid-template-columns: minmax(0, 1fr); } .board { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .room { position: relative; flex: var(--grow) 1 var(--basis); min-width: 0; display: flex; flex-direction: column; align-items: center; }

  /* 매달린 표지판 */
  .sign-wrap { position: relative; padding-top: 16px; margin-bottom: -6px; z-index: 2; }
  .sign-wrap::before, .sign-wrap::after {
    content: ""; position: absolute; top: 0; width: 2px; height: 26px; background: var(--sign-wood-dark);
  }
  .sign-wrap::before { left: 26%; transform: rotate(-8deg); }
  .sign-wrap::after { right: 26%; transform: rotate(8deg); }
  .sign {
    position: relative;
    font-family: var(--font-display);
    font-size: 22px;
    color: #4A3424;
    background: var(--sign-wood);
    border-radius: 16px;
    padding: 6px 22px 8px;
    box-shadow: 0 5px 0 var(--sign-wood-dark);
    display: flex; align-items: center; gap: 10px;
    white-space: nowrap;
  }
  .sign::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 3px rgba(255,255,255,.55); }
  .sign small { font-family: var(--font-body); font-size: 13px; opacity: .75; }

  .stage {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 6px;
    overflow-x: auto;
  }
  .stage-inner { position: relative; min-width: 520px; }
  .stage svg { display: block; width: 100%; height: auto; border-radius: 18px; }

  /* 캐릭터 */
  .person { cursor: pointer; outline: none; }
  .person .breath { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .person .head { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 3.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .person .eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 5s infinite; animation-delay: var(--d, 0s); }
  .person:hover .ring, .person:focus-visible .ring { opacity: 1; }
  .person .ring { opacity: 0; transition: opacity .2s; }
  .person.active .ring { opacity: 1; }
  @keyframes breathe { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.025, 1.045); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .ticker-text { animation: tick 14s linear infinite; }
  @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-260px); } }

  /* 말풍선 */
  .bubble {
    position: absolute;
    width: 260px;
    background: #FFFFFF;
    color: #3E3550;
    border: 2.5px solid #3E3550;
    border-radius: 20px;
    padding: 10px 14px 12px;
    box-shadow: 0 6px 0 rgba(62,53,80,.15);
    transform: translate(-50%, calc(-100% - 14px));
    z-index: 5;
    animation: pop .22s cubic-bezier(.3,1.6,.6,1);
  }
  .bubble::after {
    content: ""; position: absolute; left: var(--tail, 50%); bottom: -11px; width: 18px; height: 18px;
    background: #FFFFFF; border-right: 2.5px solid #3E3550; border-bottom: 2.5px solid #3E3550;
    transform: translateX(-50%) rotate(45deg); border-bottom-right-radius: 5px;
  }
  .bubble b { font-family: var(--font-display); font-weight: 400; font-size: 18px; }
  .bubble .role { display: inline-block; font-size: 12px; background: var(--chip); border-radius: 999px; padding: 1px 9px; margin-left: 6px; vertical-align: 2px; }
  .bubble p { margin: 6px 0 0; font-size: 14px; line-height: 1.5; }
  .bubble .order { margin-top: 8px; padding-top: 8px; border-top: 2px dashed #E3DAF0; }
  .bubble .order em { display: block; font-style: normal; font-family: var(--font-display); font-size: 13px; color: #E2667F; }
  @keyframes pop { from { transform: translate(-50%, calc(-100% - 4px)) scale(.6); opacity: 0; } }

  .roster { display: flex; flex-wrap: wrap; gap: 8px; }
  .roster button {
    font: inherit; font-size: 14px; color: var(--fg); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 14px 4px 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  }
  .roster button:hover { border-color: var(--accent); }
  .roster button:focus-visible, .person:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .roster i { width: 20px; height: 20px; border-radius: 50%; background: var(--c); display: inline-block; }

  @media (prefers-reduced-motion: reduce) {
    .person .breath, .person .head, .person .eyes, .ticker-text, .bubble { animation: none; }
  }
</style>

<div class="page">
  <section class="board" id="board" aria-label="시장 정보"></section>
  <header class="top">
    <div class="intro">
      <div class="title-row">
        <h1>AI 직원 <span>오피스</span></h1>
        <p class="hint">직원을 누르면 하는 일과 이번 지시를 알려 줘요</p>

      </div>
      <section class="plan-card" aria-label="운용 계획과 이번 달 신호">

          <div class="alloc" id="alloc" aria-hidden="true"></div>
          <ul class="alloc-legend" id="alloc-legend"></ul>
        </div>
        <div class="sig">
          <h3>이번 달 신호<span id="sig-date"></span></h3>
          <div class="buys" id="sig-buys"></div>

          <p id="sig-rule"></p>

      </section>
    </div>

    <aside class="simwin" id="simwin" aria-label="운용 시뮬레이션 창">
      <div class="titlebar">
        <div class="lights">
          <button type="button" class="red" id="sw-close" aria-label="창 닫기" title="닫기"></button>
          <button type="button" class="yellow" id="sw-min" aria-label="창 접기/펼치기" title="접기"></button>
          <button type="button" class="green" id="sw-more" aria-label="실행 기록 보기" title="실행 기록"></button>

        <div class="stats" id="sw-stats"></div>

        <ul class="history" id="sw-history" hidden></ul>
        <div class="wfoot"><div class="slots" id="sw-slots" aria-label="오늘 자동 실행 시간 (한국 시간)"></div><span>다음 <b id="sw-next">-</b></span><button type="button" id="sw-run">지금 실행</button></div>
        <span id="sw-last" hidden></span>
      </div>
    </aside>
    <button type="button" class="reopen" id="sw-reopen" hidden>시뮬레이션 창 열기</button>
  </header>
  <main class="floor-plan" id="plan"></main>
  <nav class="roster" id="roster" hidden aria-label="직원 바로 찾기"></nav>
</div>

const H = 400, WALL = 222, FEET = 342;
const SKIN = "#FFE0C7", SKIN_SHADE = "#F6C9A9", INK = "#3E3550";

/* ---------- 배경: 벽 + 바닥 ---------- */
function roomBase(t) {

  for (let y = WALL + 26; y < H; y += 30) s += `<line x1="0" x2="${t.width}" y1="${y}" y2="${y}" stroke="${t.floorLine}" stroke-width="3" stroke-linecap="round"/>`;

  s += `<rect y="${WALL - 12}" width="${t.width}" height="12" fill="${t.wallTrim}"/>`;
  return s;
}

function windowAt(x, y, w, h) {
  return `<g>
    <rect x="${x - 6}" y="${y - 6}" width="${w + 12}" height="${h + 12}" rx="18" fill="#FFFFFF"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="13" fill="#BFE3FA"/>

    <ellipse cx="${x + w * .42}" cy="${y + h * .32}" rx="14" ry="10" fill="#FFFFFF"/>
    <ellipse cx="${x + w * .74}" cy="${y + h * .68}" rx="16" ry="7" fill="#FFFFFF" opacity=".85"/>

    <rect x="${x - 10}" y="${y + h + 4}" width="${w + 20}" height="10" rx="5" fill="#FFFFFF"/>
  </g>`;
}

function clock(x, y) {
  return `<g><circle cx="${x}" cy="${y}" r="20" fill="#FFFFFF" stroke="${INK}" stroke-width="3"/>
    <line x1="${x}" y1="${y}" x2="${x}" y2="${y - 12}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>
    <line x1="${x}" y1="${y}" x2="${x + 9}" y2="${y + 3}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${x}" cy="${y}" r="2.5" fill="${INK}"/></g>`;
}

/* 시세 전광판 (트레이딩 팀) */
function tickerBoard(x, y, w) {
  const items = "코스피 ▲ · 코스닥 ▼ · 반도체 ▲ · 2차전지 ▼ · 환율 ▲ · ";
  return `<g>
    <defs><clipPath id="tk"><rect x="${x + 10}" y="${y + 10}" width="${w - 20}" height="34" rx="8"/></clipPath></defs>
    <rect x="${x}" y="${y}" width="${w}" height="54" rx="14" fill="#3A3448"/>
    <rect x="${x + 10}" y="${y + 10}" width="${w - 20}" height="34" rx="8" fill="#2A2535"/>
    <g clip-path="url(#tk)"><text class="ticker-text" x="${x + 16}" y="${y + 33}" font-family="Jua, sans-serif" font-size="17" fill="#9CF2C6">${items}${items}${items}</text></g>
    <rect x="${x + w / 2 - 2}" y="${y - 18}" width="4" height="18" fill="#3A3448"/>
  </g>`;
}

/* 캔들차트 화이트보드 (분석 팀) */
function whiteboard(x, y, w, h) {
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="#FFFFFF" stroke="#C9BDE8" stroke-width="5"/>`;
  const c = [[40, 60, 48, 66, 1], [54, 80, 50, 62, 0], [46, 58, 38, 60, 1], [36, 52, 30, 54, 1], [32, 44, 26, 48, 0], [40, 36, 24, 46, 1], [28, 34, 20, 38, 1]];
  c.forEach((k, i) => {
    const cx = x + 22 + i * ((w - 44) / (c.length - 1));
    const [o, cl, hi, lo, up] = k;
    const col = up ? "#F06C86" : "#6C9CF0";
    s += `<line x1="${cx}" x2="${cx}" y1="${y + hi}" y2="${y + lo + 18}" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>`;
    s += `<rect x="${cx - 6}" y="${y + Math.min(o, cl)}" width="12" height="${Math.abs(o - cl) + 10}" rx="3" fill="${col}"/>`;
  });
  s += `<rect x="${x + w * .2}" y="${y + h}" width="${w * .6}" height="8" rx="4" fill="#C9BDE8"/>`;
  return s;
}

/* ---------- 가구 (앞면 + 윗면) ---------- */
function bookshelf(cx, bottom) {
  const w = 96, h = 136, x = cx - w / 2, y = bottom - h;
  const books = ["#F79AB8", "#7EB6F2", "#FFD86E", "#9ED98B", "#B49CF2", "#FFB570"];
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="#D9A577"/>`;
  s += `<rect x="${x - 4}" y="${y - 10}" width="${w + 8}" height="16" rx="8" fill="#EDC49C"/>`;
  for (let r = 0; r < 3; r++) {
    const sy = y + 12 + r * 40;
    s += `<rect x="${x + 8}" y="${sy}" width="${w - 16}" height="32" rx="6" fill="#B98455"/>`;
    let bx = x + 12;
    for (let b = 0; b < 5; b++) {
      const bw = 10 + ((b + r) % 3) * 2, bh = 22 + ((b * 7 + r * 3) % 8);
      if (bx + bw > x + w - 12) break;
      s += `<rect x="${bx}" y="${sy + 32 - bh}" width="${bw}" height="${bh}" rx="3" fill="${books[(b + r * 2) % books.length]}"/>`;
      bx += bw + 3;
    }
  }
  return s;
}

function plant(cx, bottom, scale = 1) {
  const g = (dx, dy, rx, ry, rot, c) => `<ellipse cx="${cx + dx * scale}" cy="${bottom - dy * scale}" rx="${rx * scale}" ry="${ry * scale}" fill="${c}" transform="rotate(${rot} ${cx + dx * scale} ${bottom - dy * scale})"/>`;
  let s = "";
  s += g(-18, 74, 12, 30, -30, "#6FC08B") + g(18, 74, 12, 30, 30, "#6FC08B") + g(0, 86, 13, 34, 0, "#86D39E");
  s += g(-28, 56, 10, 22, -55, "#86D39E") + g(28, 56, 10, 22, 55, "#86D39E");
  const pw = 46 * scale, ph = 40 * scale;
  s += `<path d="M ${cx - pw / 2} ${bottom - ph} L ${cx + pw / 2} ${bottom - ph} L ${cx + pw / 2 - 6 * scale} ${bottom - 4 * scale} Q ${cx + pw / 2 - 7 * scale} ${bottom} ${cx + pw / 2 - 12 * scale} ${bottom} L ${cx - pw / 2 + 12 * scale} ${bottom} Q ${cx - pw / 2 + 7 * scale} ${bottom} ${cx - pw / 2 + 6 * scale} ${bottom - 4 * scale} Z" fill="#F4A58A"/>`;
  s += `<rect x="${cx - pw / 2 - 4 * scale}" y="${bottom - ph - 8 * scale}" width="${pw + 8 * scale}" height="${12 * scale}" rx="${6 * scale}" fill="#F8BFA9"/>`;
  return s;
}

function monitor(cx, deskTop, kind, idx) {
  const w = 76, h = 50, x = cx - w / 2, y = deskTop - h - 14;
  let screen;
  if (kind === "trading") {
    const pts = idx % 2 ? "8,34 20,28 30,32 42,18 54,22 66,10" : "8,30 18,32 30,20 40,24 52,14 66,16";
    screen = `<polyline points="${pts.split(" ").map(p => { const [a, b] = p.split(",").map(Number); return `${x + 5 + a},${y + 4 + b}`; }).join(" ")}" fill="none" stroke="#F06C86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else {
    screen = [0, 1, 2].map(i => `<rect x="${x + 14 + i * 18}" y="${y + 38 - (12 + ((i + idx) % 3) * 8)}" width="11" height="${12 + ((i + idx) % 3) * 8}" rx="3" fill="${["#B49CF2", "#7EB6F2", "#9ED98B"][i]}"/>`).join("");
  }
  return `<g>
    <rect x="${cx - 5}" y="${y + h}" width="10" height="14" fill="#9B92A8"/>
    <rect x="${cx - 20}" y="${deskTop - 4}" width="40" height="8" rx="4" fill="#B9B0C6"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="#4A4258"/>
    <rect x="${x + 5}" y="${y + 5}" width="${w - 10}" height="${h - 10}" rx="6" fill="#F4FBFF"/>
    ${screen}
  </g>`;
}

function desk(cx, top, kind, idx) {
  const w = 164;
  return `<g>
    <rect x="${cx - w / 2 + 14}" y="${top + 50}" width="12" height="22" rx="4" fill="#C08A5F"/>
    <rect x="${cx + w / 2 - 26}" y="${top + 50}" width="12" height="22" rx="4" fill="#C08A5F"/>
    <rect x="${cx - w / 2 + 4}" y="${top + 10}" width="${w - 8}" height="46" rx="10" fill="#D9A577"/>
    <rect x="${cx + 18}" y="${top + 20}" width="48" height="26" rx="7" fill="#E7BB90"/>
    <circle cx="${cx + 42}" cy="${top + 33}" r="3" fill="#B98455"/>
    <rect x="${cx - w / 2}" y="${top}" width="${w}" height="16" rx="8" fill="#F0CCA6"/>
    ${monitor(cx - 6, top + 4, kind, idx)}
    <rect x="${cx + 40}" y="${top - 12}" width="14" height="14" rx="4" fill="#FFFFFF"/>
    <path d="M ${cx + 54} ${top - 8} q 7 0 7 5 q 0 5 -7 5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  </g>`;
}

function meetingTable(cx, top) {
  const rx = 74, ry = 18;
  let s = "";
  // 뒤쪽 의자
  s += `<rect x="${cx - 52}" y="${top - 38}" width="34" height="40" rx="12" fill="#F7B6C6"/>`;

let bubble = null, activeEl = null;
function hide() {
  if (bubble) bubble.remove();
  if (activeEl) activeEl.classList.remove("active");
  bubble = activeEl = null;
}
function show(el) {
  if (activeEl === el) { hide(); return; }
  hide();
  const { m, t } = lookup[el.dataset.name];
  const inner = el.closest(".room");
  const head = el.querySelector(".head").getBoundingClientRect();
  const box = inner.getBoundingClientRect();
  const cx = head.left + head.width / 2 - box.left;
  const top = head.top - box.top;
  const half = 130, minX = half + 4, maxX = box.width - half - 4;
  const x = Math.max(minX, Math.min(maxX, cx));
  bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.setAttribute("role", "status");
  bubble.style.left = x + "px";
  bubble.style.top = top + "px";
  bubble.style.setProperty("--tail", (half + (cx - x)) + "px");
  bubble.style.setProperty("--chip", t.wall);
  bubble.innerHTML = `<b>${m.name}</b><span class="role">${m.role}</span><p>${m.duty}</p><p class="order"><em>이번 지시</em>${m.order}</p>`;
  inner.appendChild(bubble);
  activeEl = el;
  el.classList.add("active");
}

document.addEventListener("click", e => {

});

/* ================= 운용 시뮬레이션 (sim/simulate.py와 같은 가정·규칙) ================= */
const SLOTS = ["07:23", "09:53", "15:47"];   // 한국 시간 매일 3번 (예약 작업이 시장 정보를 갱신하는 시각과 같음)
const STORE = "aiOfficeSimRuns.v3";
const PLAN = [0.275, 0.625, 0.10, 0];      // 공격형: 국내주식, 미국주식, 국고채·현금, (현금)
const MU = [0.07, 0.07, 0.035, 0.028], VOL = [0.22, 0.17, 0.045, 0];
const CORR = [[1, .6, -.1, 0], [.6, 1, -.1, 0], [-.1, -.1, 1, 0], [0, 0, 0, 1]];
const PATHS = 4000, MONTHS = 36, DOF = 5, MONTHLY = 20;   // 매달 20만원, 3년
const PAID3 = MONTHLY * MONTHS;                              // 넣는 돈 720만원
const MI = Math.pow(1.06, 1 / 12) - 1;
const GOAL3 = MONTHLY * (Math.pow(1 + MI, MONTHS) - 1) / MI * (1 + MI);   // 연 6%로 굴렸을 때 약 789만원

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function cholesky(A) {
  const n = A.length, L = A.map(r => r.map(() => 0));
  for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) {
    let s = A[i][j]; for (let k = 0; k < j; k++) s -= L[i][k] * L[j][k];
    L[i][j] = i === j ? Math.sqrt(Math.max(s, 1e-12)) : s / L[j][j];
  }
  return L;
}
function quantile(sorted, q) { const i = (sorted.length - 1) * q, lo = Math.floor(i); return sorted[lo] + (sorted[Math.min(lo + 1, sorted.length - 1)] - sorted[lo]) * (i - lo); }

function simulate(seed) {
  const rnd = mulberry32(seed);
  let spare = null;
  const gauss = () => { if (spare !== null) { const s = spare; spare = null; return s; } let u = 0; while (u === 0) u = rnd(); const v = rnd(), r = Math.sqrt(-2 * Math.log(u)); spare = r * Math.sin(2 * Math.PI * v); return r * Math.cos(2 * Math.PI * v); };
  const tScale = Math.sqrt(DOF / (DOF - 2));
  const tdraw = () => { let c = 0; for (let k = 0; k < DOF; k++) { const g = gauss(); c += g * g; } return gauss() / Math.sqrt(c / DOF) / tScale; };
  const cov = CORR.map((r, i) => r.map((c, j) => VOL[i] * VOL[j] * c / 12));
  const L = cholesky(cov), drift = MU.map(m => Math.log1p(m) / 12);
  const f1 = new Float64Array(PATHS), f3 = new Float64Array(PATHS);
  const z = [0, 0, 0, 0], r = [0, 0, 0, 0], need = [0, 0, 0, 0];
  for (let p = 0; p < PATHS; p++) {
    const hold = [0, 0, 0, 0];
    for (let m = 0; m < MONTHS; m++) {
      // 성호: 팔지 않고, 새로 넣는 20만원으로 목표보다 모자란 자산부터 채움
      let tot = MONTHLY, ns = 0;
      for (let a = 0; a < 4; a++) tot += hold[a];
      for (let a = 0; a < 4; a++) { need[a] = Math.max(0, PLAN[a] * tot - hold[a]); ns += need[a]; }
      for (let a = 0; a < 4; a++) hold[a] += ns > 0 ? need[a] / ns * MONTHLY : PLAN[a] * MONTHLY;
      for (let a = 0; a < 4; a++) z[a] = tdraw();
      for (let a = 0; a < 4; a++) {
        let e = drift[a]; for (let k = 0; k <= a; k++) e += L[a][k] * z[k];
        hold[a] *= Math.exp(e);
      }
      if (m === 11) f1[p] = hold[0] + hold[1] + hold[2] + hold[3];
    }
    f3[p] = hold[0] + hold[1] + hold[2] + hold[3];
  }
  const s1 = Array.from(f1).sort((x, y) => x - y), s3 = Array.from(f3).sort((x, y) => x - y);
  const bins = new Array(15).fill(0);   // 3년 뒤 금액 450만 ~ 1,200만원, 50만원 간격
  for (const v of s3) bins[Math.max(0, Math.min(14, Math.floor((v - 450) / 50)))]++;
  return {
    med3: quantile(s3, .5), goal: s3.filter(v => v >= GOAL3).length / PATHS, loss3: s3.filter(v => v < PAID3).length / PATHS,
    p5: quantile(s3, .05), med1: quantile(s1, .5), loss1: s1.filter(v => v < MONTHLY * 12).length / PATHS, bins,
  };
}

/* ---- 한국 시간 계산 ---- */
const kstFmt = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
function kstParts(ms) { const o = {}; kstFmt.formatToParts(new Date(ms)).forEach(p => o[p.type] = p.value); return o; }
function slotMs(y, mo, d, hhmm) { const [h, mi] = hhmm.split(":").map(Number); return Date.UTC(y, mo - 1, d, h - 9, mi); }
function slotsAround(now) {
  const out = [];
  for (const off of [-1, 0, 1]) {
    const p = kstParts(now + off * 86400000);
    SLOTS.forEach(s => out.push(slotMs(+p.year, +p.month, +p.day, s)));
  }
  return out.sort((a, b) => a - b);
}
function lastSlot(now) { return slotsAround(now).filter(t => t <= now).pop(); }
function nextSlot(now) { return slotsAround(now).find(t => t > now); }
function fmtKst(ms, withDate = true) { const p = kstParts(ms); return (withDate ? `${+p.month}/${+p.day} ` : "") + `${p.hour}:${p.minute}`; }

/* ---- 저장 (이 브라우저에만) ---- */

function saveRuns(runs) { try { localStorage.setItem(STORE, JSON.stringify(runs.slice(-12))); } catch {} }

/* ---- 화면 그리기 ---- */
const $ = id => document.getElementById(id);
const won = v => Math.round(v).toLocaleString("ko-KR") + "만";
const pct = (v, d = 1) => (v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(d) + "%";
function renderSlots(now) {
  const p = kstParts(now), nx = nextSlot(now);
  $("sw-slots").innerHTML = SLOTS.map(s => {
    const t = slotMs(+p.year, +p.month, +p.day, s);
    const cls = t <= now ? "done" : (t === nx ? "next" : "");
    return `<span class="${cls}">${t <= now ? "✓ " : ""}${s}</span>`;
  }).join("");
  $("sw-next").textContent = fmtKst(nx, false) + (kstParts(nx).day !== p.day ? " (내일)" : "");
}
function renderRun() {
  const r = runs[runs.length - 1], prev = runs[runs.length - 2];
  if (!r) return;
  $("sw-last").textContent = fmtKst(r.at) + (r.auto ? " 자동" : " 수동");
  $("sw-status").textContent = "마지막 " + $("sw-last").textContent;
  const deltaW = k => prev && prev.med3 ? `직전 ${r[k] - prev[k] >= 0 ? "+" : "−"}${Math.abs(r[k] - prev[k]).toFixed(0)}만` : "첫 실행";
  const delta = (k, unit) => prev ? `직전 ${(r[k] - prev[k] >= 0 ? "+" : "−")}${Math.abs((r[k] - prev[k]) * 100).toFixed(1)}%p` : "첫 실행";
  const tiles = [
    ["3년 뒤 금액(중앙)", won(r.med3), r.med3 >= GOAL3 ? "good" : "", deltaW("med3")],
    ["연 6% 달성 확률", pct(r.goal, 0), "", delta("goal")],
    ["원금 손실 확률", pct(r.loss3, 0), "bad", delta("loss3")],
    ["나쁜 5% 경우", won(r.p5), "bad", deltaW("p5")],
  ];
  $("sw-stats").innerHTML = tiles.map(([k, v, c, d]) => `<div class="stat ${c}"><small>${k}</small><strong>${v}</strong><em>${d}</em></div>`).join("");
  $("sw-hist").setAttribute("aria-label", `3년 뒤 금액 분포. 1년 뒤 중앙 ${won(r.med1)} (원금 240만, 손실 확률 ${pct(r.loss1, 0)})`);
  drawHist(r.bins);
  $("sw-history").innerHTML = runs.slice().reverse().map(x => `<li>${fmtKst(x.at)} ${x.auto ? "자동" : "수동"} · 3년 중앙 ${won(x.med3)} · 6% 달성 ${pct(x.goal, 0)} · 손실 ${pct(x.loss3, 0)}</li>`).join("");
}
function drawHist(bins) {
  const W = 412, x0 = 8, x1 = W - 8, top = 14, base = 58, max = Math.max(...bins);
  const xv = v => x0 + (v - 450) / 750 * (x1 - x0), bw = (x1 - x0) / 15;
  let s = "";
  bins.forEach((c, i) => {
    const lo = 450 + i * 50, h = c / max * (base - top);
    const col = lo + 50 <= PAID3 ? "#F2A0B1" : lo >= GOAL3 ? "#8FD6AE" : "#C9BDE8";
    s += `<rect x="${(x0 + i * bw + 1.5).toFixed(1)}" y="${(base - h).toFixed(1)}" width="${(bw - 3).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${col}"/>`;
  });
  s += `<line x1="${x0}" x2="${x1}" y1="${base}" y2="${base}" stroke="var(--line)" stroke-width="1.5"/>`;
  [[PAID3, "원금 720만"], [GOAL3, "목표 789만"]].forEach(([v, lab], i) => {
    const x = xv(v), anchor = i ? "start" : "end", tx = i ? x + 3 : x - 3;
    s += `<line x1="${x}" x2="${x}" y1="${top - 6}" y2="${base}" stroke="${i ? "#1E9E5A" : "var(--muted)"}" stroke-width="1.5" stroke-dasharray="3 3"/>`;
    s += `<text x="${tx}" y="${top - 1}" text-anchor="${anchor}" font-size="10.5" fill="${i ? "#1E9E5A" : "var(--muted)"}" font-family="Gowun Dodum, sans-serif">${lab}</text>`;
  });
  [500, 600, 900, 1000, 1100].forEach(v => s += `<text x="${xv(v)}" y="${base + 14}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="Gowun Dodum, sans-serif">${v}만</text>`);
  $("sw-hist").innerHTML = s;
}

let busy = false;
function runNow(auto, slot) {
  if (busy) return;
  busy = true;
  $("sw-run").disabled = true;
  $("sw-status").textContent = "실행 중…"; $("sw-status").className = "live on";
  setTimeout(() => {
    const at = Date.now();
    const res = simulate((at ^ 0x5eed) >>> 0);
    runs.push({ at, slot: slot || null, auto, ...res });
    runs = runs.slice(-12); saveRuns(runs);
    renderRun(); renderSlots(Date.now());
    $("sw-status").textContent = (auto ? `${fmtKst(slot, false)} 자동` : `${fmtKst(at, false)} 수동`) + " 실행 완료";
    $("sw-status").className = "live on";
    const w = $("simwin"); w.classList.remove("flash"); void w.offsetWidth; w.classList.add("flash");
    $("sw-run").disabled = false; busy = false;
  }, 30);
}
function tick() {
  const now = Date.now(), ls = lastSlot(now), last = runs.filter(r => r.auto).pop();
  renderSlots(now);
  if (!last || last.slot < ls) runNow(true, ls);   // 페이지가 닫혀 있던 사이 놓친 회차는 열 때 바로 실행
}

$("sw-run").addEventListener("click", () => runNow(false));
$("sw-min").addEventListener("click", () => $("simwin").classList.toggle("min"));
$("sw-more").addEventListener("click", () => { const h = $("sw-history"); h.hidden = !h.hidden; });
$("sw-close").addEventListener("click", () => { $("simwin").hidden = true; $("sw-reopen").hidden = false; });
$("sw-reopen").addEventListener("click", () => { $("simwin").hidden = false; $("sw-reopen").hidden = true; });

renderMarket();
renderRun();
tick();
setInterval(tick, 20000);
</script>
